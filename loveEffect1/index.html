<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>心焰导火线 | 无限循环 · 拖尾火花 · 樱花飘落</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #0a0a12;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .credit {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 20;
      pointer-events: none;
      font-family: monospace;
    }

    /* 设置面板 */
    .settings-toggle {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      right: max(12px, env(safe-area-inset-right, 12px));
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }
    .settings-toggle:active { transform: scale(0.95); background: rgba(255,255,255,0.25); }
    .settings-toggle svg { width: 22px; height: 22px; fill: white; }
    .settings-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 15, 20, 0.98);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
      max-height: 70vh;
      overflow-y: auto;
      z-index: 999;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
    }
    .settings-panel.open { transform: translateY(0); }
    .settings-panel::before {
      content: '';
      display: block;
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .settings-panel h3 { color: white; font-size: 20px; margin-bottom: 20px; text-align: center; }
    .settings-section { margin-bottom: 24px; }
    .settings-section h4 { color: rgba(255,255,255,0.6); font-size: 13px; text-transform: uppercase; margin-bottom: 14px; }
    .color-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .color-preset {
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s;
    }
    .color-preset.active { border-color: white; box-shadow: 0 0 20px currentColor; }
    .custom-color {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }
    .custom-color input { width: 48px; height: 48px; border: none; border-radius: 12px; cursor: pointer; background: transparent; }
    .custom-color span { color: rgba(255,255,255,0.7); font-size: 15px; }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 998;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .overlay.open { opacity: 1; visibility: visible; }
    @media (min-width: 768px) {
      .settings-panel {
        top: 70px; right: 20px; bottom: auto; left: auto; width: 320px;
        border-radius: 20px; transform: translateX(20px); opacity: 0; visibility: hidden;
      }
      .settings-panel.open { transform: translateX(0); opacity: 1; visibility: visible; }
      .settings-panel::before { display: none; }
      .overlay { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>
  <button class="settings-toggle" id="settingsToggle" aria-label="设置">⚙️</button>
  <div class="credit">❤ 导火线·无限循环 (爱心正上方中间凹处起点) | 拖尾火花 · 飘樱 ❤</div>

  <div class="overlay" id="overlay"></div>
  <div class="settings-panel" id="settingsPanel">
    <h3>🎨 心动调色</h3>
    <div class="settings-section">
      <h4>主题光晕</h4>
      <div class="color-presets" id="colorPresets"></div>
      <div class="custom-color">
        <input type="color" id="customColor" value="#ff6b9d">
        <span>自定义色彩</span>
      </div>
    </div>
    <p style="text-align:center; font-size:12px; color:rgba(255,255,255,0.5); margin-top:6px;">🌸 导火线从爱心正上方中间凹处开始燃烧，完成后自动重置无限循环 | 樱花飘落 🌸</p>
  </div>

  <script>
    (function(){
      // ---------- 画布核心 ----------
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width, height, centerX, centerY, scaleVal;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let isMobile = false;
      let globalTime = 0;
      let lastTimestamp = 0;
      let animationId = null;
      
      // 主题色
      let themeColor = '#ff6b9d';
      
      // ---------- 爱心参数方程 (经典) ----------
      function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
      function heartY(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); }
      
      // 获取爱心轮廓点集 (用于描边和导火线路径)
      let heartOutlinePoints = [];
      function updateHeartPoints(sample = 500) {
        heartOutlinePoints = [];
        for(let i=0; i<=sample; i++) {
          let t = (i / sample) * Math.PI * 2;
          heartOutlinePoints.push({ x: heartX(t), y: heartY(t), t });
        }
      }
      updateHeartPoints(520);
      
      function mapToScreen(xRaw, yRaw) {
        return { x: centerX + xRaw * scaleVal, y: centerY + yRaw * scaleVal };
      }
      
      // ---------- 1. 爱心描边系统 (浅色可见线条 + 流动光点) ----------
      let glowPoints = [];
      function initFlowGlow() {
        for(let i=0;i<140;i++) {
          glowPoints.push({
            t: (i / 140) * Math.PI * 2,
            brightness: 0.4 + Math.random() * 0.5,
            speed: 0.002 + Math.random() * 0.005
          });
        }
      }
      
      function updateFlowGlow(delta) {
        for(let p of glowPoints) {
          p.t += p.speed * delta * 30;
          if(p.t > Math.PI*2) p.t -= Math.PI*2;
          p.brightness = 0.4 + 0.5 * (0.6 + 0.4 * Math.sin(globalTime * 2 + p.t * 3));
        }
      }
      
      function drawHeartOutline() {
        ctx.save();
        ctx.shadowBlur = 0;
        // 主轮廓线 - 浅粉可见但不抢眼
        ctx.beginPath();
        let first = true;
        for(let pt of heartOutlinePoints) {
          let {x: sx, y: sy} = mapToScreen(pt.x, pt.y);
          if(first) { ctx.moveTo(sx, sy); first = false; }
          else ctx.lineTo(sx, sy);
        }
        ctx.closePath();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = `rgba(255, 170, 190, 0.45)`;
        ctx.stroke();
        ctx.lineWidth = 0.9;
        ctx.strokeStyle = `rgba(255, 200, 215, 0.55)`;
        ctx.stroke();
        
        // 流动光点沿着爱心边缘
        for(let gp of glowPoints) {
          let pt = { x: heartX(gp.t), y: heartY(gp.t) };
          let {x: sx, y: sy} = mapToScreen(pt.x, pt.y);
          ctx.beginPath();
          ctx.arc(sx, sy, 1.5 + gp.brightness * 1.2, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255, 140, 160, ${0.4 + gp.brightness * 0.3})`;
          ctx.fill();
        }
        ctx.restore();
      }
      
      // ---------- 2. 导火线系统 (起点：爱心正上方中间凹处) ----------
      // 爱心正上方中间凹处: 心形两个顶部弧线交汇的最低点，对应参数 t = PI (3.14159)
      // 此时 heartX(PI) = 0, heartY(PI) = -13*cos(PI) - 5*cos(2PI) - 2*cos(3PI) - cos(4PI)
      // = -13*(-1) -5*1 -2*(-1) -1 = 13 -5 +2 -1 = 9，所以心形凹点在正上方偏下一点
      // 但用户说的"上面的凹处"就是两瓣心形之间的凹陷，正是 t = PI 的位置
      const FUSE_START_T = Math.PI;   // 爱心正上方中间凹处
      let fuseProgress = 0;           // 0 -> 1 (燃烧进度，顺时针绕一圈回到起点)
      const FUSE_SPEED = 0.0042;      // 燃烧速度
      let fusePoints = [];
      let tailParticles = [];
      
      // 重置导火线 (循环)
      function resetFuse() {
        fuseProgress = 0;
        fusePoints = [];
        tailParticles = [];
      }
      
      function getHeartPointByT(t) {
        return { x: heartX(t), y: heartY(t), t };
      }
      
      // 根据进度获取点: progress 0->1 对应从起始角度顺时针增加一整圈 (2PI)
      function getHeartPointByProgress(progress) {
        let t = FUSE_START_T + progress * Math.PI * 2;
        // 归一化到 [0, 2PI)
        if(t >= Math.PI * 2) t -= Math.PI * 2;
        return getHeartPointByT(t);
      }
      
      function updateFuse(delta) {
        fuseProgress += FUSE_SPEED * delta * 30;
        
        // 完成一次完整燃烧后重置，实现无限循环
        if(fuseProgress >= 1.0) {
          resetFuse();
          return;
        }
        
        // 生成平滑路径点 (无抖动偏移，完全沿着爱心轮廓)
        let newPoints = [];
        const steps = Math.max(35, Math.floor(90 * fuseProgress));
        for(let i=0; i<=steps; i++) {
          let p = (i / steps) * fuseProgress;
          let raw = getHeartPointByProgress(p);
          let screen = mapToScreen(raw.x, raw.y);
          newPoints.push({
            x: screen.x,
            y: screen.y,
            progress: p
          });
        }
        fusePoints = newPoints;
        
        // 生成拖尾火花粒子 (沿路径末端)
        if(fusePoints.length >= 2 && fuseProgress < 0.99) {
          let tail = fusePoints[fusePoints.length-1];
          let prev = fusePoints.length>1 ? fusePoints[fusePoints.length-2] : tail;
          let dirX = tail.x - prev.x;
          let dirY = tail.y - prev.y;
          let lenDir = Math.hypot(dirX, dirY);
          if(lenDir > 0.01) { dirX /= lenDir; dirY /= lenDir; }
          let sparkCount = isMobile ? 4 : 6;
          for(let i=0;i<sparkCount;i++) {
            let angleOffset = (Math.random() - 0.5) * 1.2;
            let speed = 1.5 + Math.random() * 3.0;
            let vx = dirX * speed + (Math.random() - 0.5) * 2.0;
            let vy = dirY * speed + (Math.random() - 0.5) * 2.0;
            tailParticles.push({
              x: tail.x, y: tail.y,
              vx: vx, vy: vy,
              life: 1.0,
              size: 2.2 + Math.random() * 3.5,
              alpha: 0.9
            });
          }
        }
        
        // 更新拖尾粒子
        for(let i=tailParticles.length-1; i>=0; i--) {
          let p = tailParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.life -= 0.018;
          if(p.life <= 0) tailParticles.splice(i,1);
        }
      }
      
      function drawFuse(rgb) {
        if(fusePoints.length < 2) return;
        ctx.save();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(fusePoints[0].x, fusePoints[0].y);
        for(let i=1; i<fusePoints.length; i++) {
          ctx.lineTo(fusePoints[i].x, fusePoints[i].y);
        }
        let gradient = ctx.createLinearGradient(fusePoints[0].x, fusePoints[0].y, 
          fusePoints[fusePoints.length-1].x, fusePoints[fusePoints.length-1].y);
        gradient.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.9)`);
        gradient.addColorStop(0.5, `rgba(${rgb.r+40}, ${rgb.g+20}, ${rgb.b+20}, 0.95)`);
        gradient.addColorStop(1, `rgba(255, 210, 130, 1)`);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 4.2;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = `rgba(255, 230, 170, 0.95)`;
        ctx.stroke();
        
        // 导火线末端光晕 (燃烧点)
        if(fusePoints.length > 0) {
          let tip = fusePoints[fusePoints.length-1];
          let glowSize = 18 + Math.sin(globalTime * 22) * 4;
          let radGrad = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, glowSize);
          radGrad.addColorStop(0, `rgba(255, 190, 110, 1)`);
          radGrad.addColorStop(0.5, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.7)`);
          radGrad.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);
          ctx.beginPath();
          ctx.arc(tip.x, tip.y, glowSize, 0, Math.PI*2);
          ctx.fillStyle = radGrad;
          ctx.fill();
          
          ctx.beginPath();
          ctx.arc(tip.x, tip.y, 5, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255, 230, 150, 1)`;
          ctx.fill();
        }
        ctx.restore();
      }
      
      function drawTailSparks(rgb) {
        for(let p of tailParticles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
          ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${p.life * 0.85})`;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life * 0.6, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255, 210, 110, ${p.life * 0.8})`;
          ctx.fill();
        }
      }
      
      // ---------- 3. 樱花飘落系统 ----------
      class SakuraPetal {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = -30 - Math.random() * 100;
          this.size = 7 + Math.random() * 10;
          this.speedY = 0.9 + Math.random() * 1.7;
          this.speedX = (Math.random() - 0.5) * 0.7;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.045;
          this.alpha = 0.6 + Math.random() * 0.35;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.rotation += this.rotSpeed;
          if(this.y > height + 80 || this.x < -80 || this.x > width + 80) {
            this.reset();
            this.y = -30;
            this.x = Math.random() * width;
          }
        }
        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size*0.5, this.size*0.7, 0, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255, 190, 210, ${this.alpha * 0.85})`;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, this.size*0.25, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255, 120, 150, 0.7)`;
          ctx.fill();
          ctx.restore();
        }
      }
      
      let sakuraPetals = [];
      const SAKURA_COUNT = 52;
      function initSakura() {
        for(let i=0;i<SAKURA_COUNT;i++) sakuraPetals.push(new SakuraPetal());
      }
      
      // ---------- 辅助: 主题颜色转换 ----------
      function hexToRgb(hex) {
        let h = hex.slice(1);
        let r = parseInt(h.substring(0,2),16);
        let g = parseInt(h.substring(2,4),16);
        let b = parseInt(h.substring(4,6),16);
        return { r, g, b };
      }
      
      // ---------- 动画主循环 ----------
      let frame = 0;
      function updateWorld(delta) {
        globalTime += delta * 1.2;
        frame++;
        updateFlowGlow(delta);
        updateFuse(delta);
        for(let s of sakuraPetals) s.update();
      }
      
      function render() {
        if(!ctx) return;
        ctx.fillStyle = 'rgba(10, 10, 18, 0.22)';
        ctx.fillRect(0, 0, width, height);
        
        const rgb = hexToRgb(themeColor);
        
        drawHeartOutline();
        drawFuse(rgb);
        drawTailSparks(rgb);
        for(let s of sakuraPetals) s.draw();
        
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        let grad = ctx.createRadialGradient(centerX, centerY, 25, centerX, centerY, Math.min(width,height)*0.36);
        grad.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.07)`);
        grad.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
      }
      
      function animate(timestamp) {
        const targetFPS = isMobile ? 50 : 60;
        const interval = 1000 / targetFPS;
        if(timestamp - lastTimestamp < interval) {
          animationId = requestAnimationFrame(animate);
          return;
        }
        let delta = Math.min(0.033, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;
        updateWorld(delta);
        render();
        animationId = requestAnimationFrame(animate);
      }
      
      function resizeAndReset() {
        width = window.innerWidth;
        height = window.innerHeight;
        isMobile = width < 768;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        
        centerX = width / 2;
        centerY = height / 2;
        const heartSpanX = 33, heartSpanY = 31;
        let scaleW = (width * 0.72) / heartSpanX;
        let scaleH = (height * 0.74) / heartSpanY;
        scaleVal = Math.min(scaleW, scaleH);
        if(isMobile) scaleVal *= 1.02;
        
        updateHeartPoints(520);
        for(let s of sakuraPetals) {
          if(s.y > height || s.x < 0 || s.x > width) s.reset();
          s.x = Math.min(width, Math.max(0, s.x));
        }
        // 重置导火线状态
        resetFuse();
      }
      
      // UI 设置面板
      const settingsToggle = document.getElementById('settingsToggle');
      const settingsPanel = document.getElementById('settingsPanel');
      const overlayDiv = document.getElementById('overlay');
      const colorPresetsDiv = document.getElementById('colorPresets');
      const customColorPicker = document.getElementById('customColor');
      
      const presetColors = [
        { name: '浪漫粉', color: '#ff6b9d' }, { name: '心动红', color: '#ff4757' },
        { name: '梦幻紫', color: '#c084fc' }, { name: '天空蓝', color: '#4da6ff' },
        { name: '落日橙', color: '#ff9f43' }, { name: '清新绿', color: '#26de81' },
        { name: '樱语', color: '#ffb3c6' }, { name: '冰青', color: '#00d2d3' }
      ];
      
      function togglePanel(open) {
        let isOpen = settingsPanel.classList.contains('open');
        let should = open !== undefined ? open : !isOpen;
        settingsPanel.classList.toggle('open', should);
        overlayDiv.classList.toggle('open', should);
      }
      settingsToggle.addEventListener('click', () => togglePanel());
      overlayDiv.addEventListener('click', () => togglePanel(false));
      
      presetColors.forEach(p => {
        let btn = document.createElement('button');
        btn.className = 'color-preset';
        btn.style.backgroundColor = p.color;
        btn.addEventListener('click', () => {
          themeColor = p.color;
          customColorPicker.value = p.color;
          document.querySelectorAll('.color-preset').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
        if(p.color === themeColor) btn.classList.add('active');
        colorPresetsDiv.appendChild(btn);
      });
      customColorPicker.addEventListener('input', (e) => {
        themeColor = e.target.value;
        document.querySelectorAll('.color-preset').forEach(b => b.classList.remove('active'));
      });
      
      window.addEventListener('resize', () => { resizeAndReset(); });
      
      function start() {
        resizeAndReset();
        initSakura();
        initFlowGlow();
        resetFuse();
        animationId = requestAnimationFrame(animate);
      }
      start();
    })();
  </script>
</body>
</html>
